name: Stable plugin release

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  release:
    # Never run PR-head code. Only build the commit already merged into main.
    if: github.event.pull_request.merged == true && github.repository == 'filipeesch/dsh-design'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: stable-plugin-release
      queue: max
    env:
      SOURCE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify merged source
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Select release version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-bundle.mjs plan
      - name: Check and pack the bundle
        if: steps.plan.outputs.version != ''
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/release-bundle.mjs pack "$RELEASE_VERSION"
      - name: Upload and publish verified assets
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/release-bundle.mjs publish "$RELEASE_VERSION"
